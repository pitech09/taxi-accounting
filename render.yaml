services:
  - type: web
    name: taxi-accounting
    runtime: python
    buildCommand: ./build.sh
    startCommand: gunicorn taxiaccounting.wsgi:application --log-file -
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: DATABASE_URL
        fromDatabase:
          name: taxi-accounting-db
          property: connectionString
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

databases:
  - name: taxi-accounting-db
    databaseName: taxi_accounting
    plan: free