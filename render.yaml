services:
  - type: web
    name: taxi-accounting
    env: python
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
    startCommand: gunicorn taxi_accounting.wsgi:application
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: taxi_db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: DISABLE_COLLECTSTATIC
        value: 1
    plan: free
    buildFilter:
      paths:
        - backend/**