{% extends 'base.html' %}
{% block title %}New Settlement{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2><i class="bi bi-plus-circle"></i> New Daily Settlement</h2>
    <a href="{% url 'owner_settlement_list' %}" class="btn btn-outline-secondary"><i class="bi bi-list"></i> All Settlements</a>
</div>

<div class="card">
    <div class="card-header bg-primary text-white">
        <i class="bi bi-cash-stack"></i> Enter Settlement Details
    </div>
    <div class="card-body">
        <form method="post" id="settlementForm">
            {% csrf_token %}
            
            <div class="row mb-3">
                <div class="col-md-4">
                    <label class="form-label">Driver *</label>
                    <select name="driver" class="form-select" required id="driverSelect">
                        <option value="">-- Select Driver --</option>
                        {% for driver in drivers %}
                        <option value="{{ driver.id }}" 
                                data-model="{{ driver.vehicle.operating_model }}"
                                data-quota="{{ driver.effective_quota }}"
                                data-salary="{{ driver.effective_salary }}"
                                data-percentage="{{ driver.effective_percentage }}"
                                data-contract-target="{{ driver.effective_contract_target }}"
                                data-contract-bonus-type="{{ driver.vehicle.contract_success_bonus_type }}"
                                data-contract-bonus-fixed="{{ driver.effective_contract_success_bonus_fixed }}"
                                data-contract-bonus-pct="{{ driver.effective_contract_success_bonus_percentage }}"
                                data-contract-failure-pct="{{ driver.effective_contract_failure_percentage }}">
                            {{ driver.name }} - {{ driver.vehicle.name }} ({{ driver.vehicle.plate }})
                        </option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Date *</label>
                    <input type="date" name="date" class="form-control" required value="{% now 'Y-m-d' %}">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Payment Method</label>
                    <select name="payment_method" class="form-select">
                        <option value="cash">Cash</option>
                        <option value="ecocash">EcoCash</option>
                        <option value="card">Card</option>
                        <option value="mixed" selected>Mixed</option>
                    </select>
                </div>
            </div>

            <!-- Operating Model Info -->
            <div id="modelInfo" class="alert alert-info d-none">
                <strong>Operating Model:</strong> <span id="modelName"></span>
            </div>

            <!-- Income Section -->
            <h5 class="text-success mt-4"><i class="bi bi-arrow-up-circle"></i> Income</h5>
            <div class="row mb-3">
                <div class="col-md-4">
                    <label class="form-label">Cash Collected (M)</label>
                    <input type="number" name="cash_collected" class="form-control income-input" step="0.01" value="0">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Mobile/EcoCash (M)</label>
                    <input type="number" name="mobile_collected" class="form-control income-input" step="0.01" value="0">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Card (M)</label>
                    <input type="number" name="card_collected" class="form-control income-input" step="0.01" value="0">
                </div>
            </div>
            <div class="row mb-3">
                <div class="col-md-4">
                    <label class="form-label">Advance Income (M)</label>
                    <input type="number" name="advance_income" class="form-control income-input" step="0.01" value="0">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Other Income (M)</label>
                    <input type="number" name="other_income" class="form-control income-input" step="0.01" value="0">
                </div>
                <div class="col-md-4">
                    <label class="form-label"><strong>Total Income</strong></label>
                    <input type="text" class="form-control" id="totalIncome" value="M 0.00" readonly>
                </div>
            </div>

            <!-- Expenses Section -->
            <h5 class="text-danger mt-4"><i class="bi bi-arrow-down-circle"></i> Expenses (Paid by Owner)</h5>
            <div class="row mb-3">
                <div class="col-md-4">
                    <label class="form-label">Fuel Cost (M)</label>
                    <input type="number" name="fuel_cost" class="form-control expense-input" step="0.01" value="0">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Toll Cost (M)</label>
                    <input type="number" name="toll_cost" class="form-control expense-input" step="0.01" value="0">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Border Fee (M)</label>
                    <input type="number" name="border_fee" class="form-control expense-input" step="0.01" value="0">
                </div>
            </div>
            <div class="row mb-3">
                <div class="col-md-4">
                    <label class="form-label">Repair Cost (M)</label>
                    <input type="number" name="repair_cost" class="form-control expense-input" step="0.01" value="0">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Driver Allowance (M)</label>
                    <input type="number" name="driver_allowance" class="form-control expense-input" step="0.01" value="0">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Other Expenses (M)</label>
                    <input type="number" name="other_expenses" class="form-control expense-input" step="0.01" value="0">
                </div>
            </div>
            <div class="row mb-3">
                <div class="col-md-4">
                    <label class="form-label"><strong>Total Expenses</strong></label>
                    <input type="text" class="form-control" id="totalExpenses" value="M 0.00" readonly>
                </div>
                <div class="col-md-4">
                    <label class="form-label"><strong>Gross Profit</strong></label>
                    <input type="text" class="form-control" id="grossProfit" value="M 0.00" readonly>
                </div>
            </div>

            <!-- Notes -->
            <div class="row mb-3">
                <div class="col-12">
                    <label class="form-label">Notes</label>
                    <textarea name="notes" class="form-control" rows="2"></textarea>
                </div>
            </div>

            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-lg btn-primary">
                    <i class="bi bi-save"></i> Save Settlement
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
$(document).ready(function() {
    // Calculate totals
    function calculateTotals() {
        let totalIncome = 0;
        $('.income-input').each(function() {
            totalIncome += parseFloat($(this).val()) || 0;
        });
        $('#totalIncome').val('M ' + totalIncome.toFixed(2));
        
        let totalExpenses = 0;
        $('.expense-input').each(function() {
            totalExpenses += parseFloat($(this).val()) || 0;
        });
        $('#totalExpenses').val('M ' + totalExpenses.toFixed(2));
        
        let grossProfit = totalIncome - totalExpenses;
        $('#grossProfit').val('M ' + grossProfit.toFixed(2));
    }
    
    $('.income-input, .expense-input').on('input', calculateTotals);
    
    // Show model info when driver selected
    $('#driverSelect').on('change', function() {
        const selected = $(this).find('option:selected');
        const model = selected.data('model');
        
        if (model) {
            $('#modelInfo').removeClass('d-none');
            $('#modelName').text(model.charAt(0).toUpperCase() + model.slice(1));
        } else {
            $('#modelInfo').addClass('d-none');
        }
    });
});
</script>
{% endblock %}
