{% extends 'base.html' %}
{% block title %}Edit Vehicle{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2><i class="bi bi-pencil"></i> Edit Vehicle: {{ vehicle.name }}</h2>
    <a href="{% url 'owner_vehicle_list' %}" class="btn btn-outline-secondary">Back</a>
</div>
<div class="card">
    <div class="card-header bg-primary text-white">Vehicle Details</div>
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            {% include 'owner/vehicles/_form.html' %}
            <button type="submit" class="btn btn-primary">Update Vehicle</button>
        </form>
    </div>
</div>
{% endblock %}
